on:
  push:
  pull_request:

jobs:
  test-install:
    runs-on:
      size: 2x8
      image: t67llm9p7m.registry.depot.dev/iiab-prebuilt:latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Boot pre-built IIAB VM
        run: |
          sudo qemu-system-x86_64 \
            -enable-kvm \
            -m 4096 \
            -smp 2 \
            -serial file:/tmp/vm-console.log \
            -display none \
            -drive file=noble-server-cloudimg-amd64.img,format=qcow2 \
            -net nic \
            -net user,hostfwd=tcp::2222-:22 \
            -daemonize \
            -pidfile /tmp/qemu.pid
          sudo chmod 644 /tmp/qemu.pid

      - name: Wait for SSH
        run: |
          for i in $(seq 1 60); do
            ssh -o StrictHostKeyChecking=no \
                -o ConnectTimeout=5 \
                -i /tmp/vm_key \
                -p 2222 iiab@localhost true && break
            echo "Waiting for VM... ($i)"
            sleep 5
          done

      - name: Run your tests
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/vm_key -p 2222 iiab@localhost <<'ENDSSH'
            sudo mkdir /etc/iiab
            sudo cp /opt/iiab/iiab/vars/local_vars_large.yml /etc/iiab/local_vars.yml
            cd /opt/iiab/iiab
            sudo ./iiab-install
          ENDSSH
